<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../assets/css/globale.css" />
    <link rel="stylesheet" href="register.css" />
    <title>Inscription</title>
  </head>

  <body>
    <form class="glass-card register-card" id="register-form" novalidate>
      <div class="litle-header">
        Deja un compte ?
        <a href="../connection/connection.html">Se connecter</a>
      </div>

      <h1>Creer un compte</h1>
      <p class="subtitle">Rejoins la plateforme et commence a soumettre tes dessins.</p>

      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

      <section class="form-grid">
        <div class="field">
          <label for="nom">Nom *</label>
          <input id="nom" name="nom" type="text" autocomplete="family-name" required />
        </div>
        <div class="field">
          <label for="prenom">Prenom *</label>
          <input id="prenom" name="prenom" type="text" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label for="login">Login *</label>
          <input id="login" name="login" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Mot de passe *</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required />
        </div>
        <div class="field">
          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="0" max="120" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="sexe">Sexe</label>
          <select id="sexe" name="sexe">
            <option value="">Non renseigne</option>
            <option value="H">H</option>
            <option value="F">F</option>
          </select>
        </div>
        <div class="field field-wide">
          <label for="adresse">Adresse</label>
          <input id="adresse" name="adresse" type="text" autocomplete="street-address" />
        </div>
        <div class="field">
          <label for="numClub">Numero de club</label>
          <input id="numClub" name="numClub" type="number" min="1" inputmode="numeric" />
        </div>
      </section>

      <div class="register-actions">
        <button class="btn btn-primary" id="register-submit" type="submit">S'inscrire</button>
        <button class="btn btn-secondary" type="reset">Reset</button>
      </div>
    </form>

    <script type="module" src="register.js"></script>
  </body>
</html>
