<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../public/assets/css/globale.css" />
    <link rel="stylesheet" href="403.css" />
    <title>403 - Acces interdit</title>
  </head>

  <body>
    <main class="glass-card error-card">
      <div class="error-hero">
        <div class="error-code">403</div>
        <div class="error-text">
          <h1>Acces interdit</h1>
          <p class="subtitle">Tu n'as pas les autorisations pour acceder a cette page.</p>
          <div class="status-line">Code erreur: 403 - Forbidden</div>
        </div>
      </div>

      <div class="error-details">
        <p>Tu peux essayer:</p>
        <ul>
          <li>Verifier que tu es connecte avec le bon compte</li>
          <li>Demander un acces a un administrateur</li>
          <li>Revenir a une page autorisee</li>
        </ul>
      </div>

      <div class="error-actions">
        <a class="btn btn-primary" href="../../Authentification/connection/connection.html"> Se connecter </a>
        <a class="btn btn-secondary" href="../../globale/dashboard/dashboard.html"> Retour au dashboard </a>
      </div>
    </main>
  </body>
</html>
