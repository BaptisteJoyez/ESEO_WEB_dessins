<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../assets/css/globale.css" />
    <link rel="stylesheet" href="../../../assets/css/site-title.css" />
    <link rel="stylesheet" href="404.css" />
    <title>SketchHub - 404 Page introuvable</title>
  </head>

  <body>
    <div class="site-title">
      <span class="site-title__glow">SketchHub</span>
    </div>
    <main class="glass-card error-card">
      <div class="error-hero">
        <div class="error-code">404</div>
        <div class="error-text">
          <h1>Page introuvable</h1>
          <p class="subtitle">La page que tu cherches n'existe pas ou a ete deplacee.</p>
          <div class="status-line">Code erreur: 404 - Not Found</div>
        </div>
      </div>

      <div class="error-details">
        <p>Tu peux essayer:</p>
        <ul>
          <li>Verifier l'URL</li>
          <li>Revenir a une page connue</li>
          <li>Passer par le dashboard pour naviguer</li>
        </ul>
      </div>

      <div class="error-actions">
        <a class="btn btn-primary" id="dashboard" href="../../globale/dashboard/dashboard.html"> Retour au dashboard </a>
        <a class="btn btn-secondary" id="login" href="../../Authentification/connection/connection.html"> Se connecter </a>
      </div>
    </main>
    <script type="module" src="/view/errors/404/404.js"></script>
  </body>
</html>
