<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../assets/css/globale.css" />
    <link rel="stylesheet" href="rate_drawing.css" />
    <title>Dessins à évaluer</title>
  </head>

  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">Évaluation</p>
          <h1>Dessins à évaluer</h1>
          <p class="subtitle">Evaluez ici les dessins du concours</p>
        </div>
        <a class="btn btn-secondary" href="../dashboard/dashboard.html">Retour au dashboard</a>
      </header>

      <section class="glass-card table-section">
        <div class="table-wrapper">
          <table class="drawings-table">
            <thead>
              <tr>
                <th>Dessin</th>
                <th>Dessinateur</th>
                <th>Date de soumission</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="drawings-tbody">
              <tr>
                <td colspan="4" class="empty-state">
                  <p>Aucun dessin à évaluer pour le moment.</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Modal pour afficher l'image en grand -->
      <div id="image-modal" class="modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
          <button class="modal-close" id="close-modal">&times;</button>
          <img id="modal-image" src="" alt="Dessin en grand" />
        </div>
      </div>

      <!-- Modal pour noter un dessin -->
      <div id="rating-modal" class="modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="rating-modal-content">
          <button class="modal-close" id="close-rating-modal">&times;</button>
          
          <h2 class="rating-modal-title">Évaluer le dessin</h2>
          
          <div class="rating-modal-body">
            <!-- Colonne gauche : image -->
            <div class="rating-image-section">
              <img id="rating-drawing-image" src="" alt="Dessin à évaluer" class="rating-image" />
              <p class="image-hint">Cliquez sur l'image pour l'agrandir</p>
            </div>
            
            <!-- Colonne droite : formulaire -->
            <div class="rating-form-section">
              <!-- Date du jour -->
              <div class="rating-date">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span id="rating-current-date"></span>
              </div>
              
              <!-- Nom et prénom de l'évaluateur -->
              <div class="rating-evaluator-info">
                <div class="rating-field rating-field-half">
                  <label for="evaluator-firstname">Prénom de l'évaluateur</label>
                  <input 
                    type="text" 
                    id="evaluator-firstname" 
                    placeholder="Votre prénom"
                    required
                  />
                </div>
                <div class="rating-field rating-field-half">
                  <label for="evaluator-lastname">Nom de l'évaluateur</label>
                  <input 
                    type="text" 
                    id="evaluator-lastname" 
                    placeholder="Votre nom"
                    required
                  />
                </div>
              </div>
              
              <!-- Note -->
              <div class="rating-field">
                <label for="rating-score">Note (0-20)</label>
                <div class="rating-score-input">
                  <button type="button" class="score-btn score-decrease" aria-label="Diminuer la note">−</button>
                  <input 
                    type="number" 
                    id="rating-score" 
                    min="0" 
                    max="20" 
                    step="0.5" 
                    value="10"
                    required
                  />
                  <button type="button" class="score-btn score-increase" aria-label="Augmenter la note">+</button>
                </div>
              </div>
              
              <!-- Commentaire -->
              <div class="rating-field">
                <label for="rating-comment">Commentaire</label>
                <textarea 
                  id="rating-comment" 
                  rows="6" 
                  placeholder="Ajoutez vos remarques sur ce dessin..."
                ></textarea>
              </div>
              
              <!-- Bouton d'envoi -->
              <button type="button" class="btn-submit-rating" id="submit-rating">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                Envoyer l'évaluation
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="rate_drawing.js"></script>
  </body>
</html>
