<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="manage_competitions.css" />
    <style>
      .site-brand{font-weight:700;color:#ffd166;font-size:0.95rem;letter-spacing:0.02em;margin-bottom:8px}
    </style>
    <title>SketchHub - Gestion des concours</title>
  </head>

  <body>
    <main class="admin-page">
      <header class="admin-header">
        <div class="site-brand">SketchHub</div>
        <div class="header-copy">
          <p class="eyebrow">Administration</p>
          <h1>Gestion des concours</h1>
          <p class="subtitle">Cree un concours puis ajuste son statut directement dans le tableau.</p>
        </div>
        <a class="btn ghost" href="../dashboard/dashboard.html">Retour au dashboard</a>
      </header>

      <section class="create-panel" aria-labelledby="create-title">
        <div class="panel-head">
          <h2 id="create-title">Creer ou modifier un concours</h2>
          <p class="panel-note">Les champs marques * sont obligatoires.</p>
        </div>

        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

        <form id="concours-form" class="create-form" novalidate>
          <input type="hidden" id="numConcours" name="numConcours" />

          <div class="grid two">
            <div class="field">
              <label for="theme">Theme *</label>
              <input id="theme" name="theme" type="text" required />
            </div>
            <div class="field">
              <label for="lieu">Lieu *</label>
              <input id="lieu" name="lieu" type="text" required />
            </div>
          </div>

          <div class="grid three">
            <div class="field">
              <label for="dateDebut">Date debut *</label>
              <input id="dateDebut" name="dateDebut" type="date" required />
            </div>
            <div class="field">
              <label for="dateFin">Date fin *</label>
              <input id="dateFin" name="dateFin" type="date" required />
            </div>
            <div class="field">
              <label for="etat">Etat initial *</label>
              <select id="etat" name="etat" required>
                <option value="pas commence">pas commence</option>
                <option value="en cours">en cours</option>
                <option value="attente">attente</option>
                <option value="resultat">resultat</option>
                <option value="evalue">evalue</option>
              </select>
            </div>
          </div>

          <div class="grid two">
            <div class="field">
              <label for="numPresident">Numero president</label>
              <input id="numPresident" name="numPresident" type="number" min="1" inputmode="numeric" />
            </div>
            <div class="actions">
              <button class="btn primary" id="save-button" type="submit">Enregistrer</button>
              <button class="btn ghost" id="cancel-button" type="button">Annuler</button>
            </div>
          </div>
        </form>
      </section>

      <section class="table-panel" aria-labelledby="table-title">
        <div class="panel-head table-head">
          <h2 id="table-title">Concours existants</h2>
          <button class="btn ghost" id="refresh-button" type="button">Rafraichir</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Theme</th>
                <th>Dates</th>
                <th>Lieu</th>
                <th>President</th>
                <th>Statut</th>
                <th>Edition</th>
              </tr>
            </thead>
            <tbody id="concours-body">
              <tr>
                <td colspan="7" class="empty">Chargement...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="manage_competitions.js"></script>
  </body>
</html>
