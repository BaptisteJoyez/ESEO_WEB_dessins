<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../assets/css/globale.css" />
    <link rel="stylesheet" href="rate_drawing.css" />
    <title>Dessins à évaluer</title>
  </head>

  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <p class="eyebrow">Évaluation</p>
          <h1>Dessins à évaluer</h1>
          <p class="subtitle">Evaluez ici les dessins du concours</p>
        </div>
        <a class="btn btn-secondary" href="../dashboard/dashboard.html">Retour au dashboard</a>
      </header>

      <section class="glass-card table-section">
        <div class="table-wrapper">
          <table class="drawings-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Dessin</th>
                <th>Date de soumission</th>
                <th>Note</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="drawings-tbody">
              <tr>
                <td colspan="5" class="empty-state">
                  <p>Aucun dessin à évaluer pour le moment.</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="rate_drawing.js"></script>
  </body>
</html>
