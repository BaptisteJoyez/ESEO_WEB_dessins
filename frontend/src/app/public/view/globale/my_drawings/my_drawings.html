<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../assets/css/globale.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="my_drawings.css" />
    <title>SketchHub - Mes dessins</title>
  </head>

  <body>
    <main class="page">
      <header class="glass-card page-header">
        <div class="site-brand">SketchHub</div>
        <div>
          <p class="eyebrow">Galerie</p>
          <h1>Mes dessins</h1>
          <p class="subtitle">Fais defiler tes dessins recus depuis le backend.</p>
        </div>
        <a class="btn btn-secondary" href="../dashboard/dashboard.html">Retour au dashboard</a>
      </header>

      <section class="glass-card filters">
        <div class="filter">
          <label for="filter-year">Annee</label>
          <select id="filter-year">
            <option value="">Toutes les annees</option>
          </select>
        </div>
        <div class="filter">
          <label for="filter-concours">Concours</label>
          <select id="filter-concours">
            <option value="">Tous les concours</option>
          </select>
        </div>
        <button type="button" class="btn btn-secondary" id="filter-reset">Reinitialiser</button>
      </section>

      <section class="glass-card carousel-wrap">
        <div id="drawingsCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators" id="carousel-indicators">
            <button type="button" data-bs-target="#drawingsCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          </div>

          <div class="carousel-inner" id="carousel-inner">
            <div class="carousel-item active">
              <div class="placeholder-card">
                <div class="placeholder-image"></div>
                <div class="placeholder-text">
                  <p>Aucun dessin charge pour le moment.</p>
                  <p>Les images base64 seront inserees ici par le JS.</p>
                </div>
              </div>
            </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#drawingsCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Precedent</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#drawingsCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Suivant</span>
          </button>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="my_drawings.js"></script>
  </body>
</html>
