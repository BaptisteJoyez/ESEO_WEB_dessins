<!doctype html>
<html lang="fr">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../assets/css/globale.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="competitions.css" />
    <title>Competitions</title>
    </head>

    <body>
    <main class="page">
        <section class="concours-page">
        <h1 class="main-title">Espace Concours</h1>

            <div class="concours-container">
        
                <div class="glass-card category-card future">
                    <div class="card-header">
                       <span class="icon">⏳</span>
                        <h2>À venir</h2>
                        <span class="count-badge" id="count-future">0</span>
                    </div>
                    <div class="card-content">
                       <ul class="contest-list" id="list-future">
                           </ul>
                    </div>
               </div>

              <div class="glass-card category-card active">
                  <div class="card-header">
                       <span class="icon">🔥</span>
                       <h2>En cours</h2>
                        <span class="count-badge" id="count-active">0</span>
                   </div>
                    <div class="card-content">
                        <ul class="contest-list" id="list-active">
                            </ul>
                    </div>
                </div>

                <div class="glass-card category-card closed">
                    <div class="card-header">
                        <span class="icon">🔒</span>
                        <h2>Terminés</h2>
                        <span class="count-badge" id="count-closed">0</span>
                    </div>
                    <div class="card-content">
                        <ul class="contest-list" id="list-closed">
                            </ul>
                    </div>
                </div>

            </div>
        </section>
