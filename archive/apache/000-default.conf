<VirtualHost *:80>

    # =========================
    # FRONTEND
    # =========================
    DocumentRoot /var/www/html/frontend/src/app/public

    <Directory /var/www/html/frontend/src/app/public>
        AllowOverride All
        Require all granted
    </Directory>

    # =========================
    # BACKEND API
    # =========================
    Alias /api /var/www/html/backend/public

    <Directory /var/www/html/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # =========================
    # FORCED 403 (TEST)
    # =========================
    <Directory "/var/www/html/frontend/src/app/public/forbidden">
        Require all denied
    </Directory>

    # =========================
    # ERROR PAGES
    # =========================
    ErrorDocument 403 /assets/view/errors/403/403.html
    ErrorDocument 404 /assets/view/errors/404/404.html

</VirtualHost>
