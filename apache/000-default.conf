<VirtualHost *:80>
    DocumentRoot /var/www/html/frontend/src/app/public

    <Directory /var/www/html/frontend/src/app/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorDocument 403 /view/errors/403/403.html
    ErrorDocument 404 /view/errors/404/404.html
</VirtualHost>
