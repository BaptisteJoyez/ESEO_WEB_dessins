services:
  web:
    build: .
    container_name: eseo_web
    ports:
      - "8080:80"
      - "9003:9003"
    volumes:
      - .:/var/www/html
      - ./apache:/etc/apache2/sites-available
      - ./php/conf.d:/usr/local/etc/php/conf.d
    environment:
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    restart: unless-stopped
