version: "3.8"

services:
  web:
    image: php:8.1-apache
    container_name: eseo_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./apache:/etc/apache2/sites-available:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: eseo_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: eseo_db
      MYSQL_USER: eseo_user
      MYSQL_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
